name: Nightly Autonomous Research

on:
  schedule:
    # Runs every night at 02:00 UTC (04:00 CEST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Number of autonomous research cycles'
        required: false
        default: '5'
      temperature:
        description: 'Speculation temperature'
        required: false
        default: '0.75'
      models:
        description: 'Model aliases to rotate through'
        required: false
        default: 'sonnet,qwen_math'

permissions:
  contents: write

jobs:
  nightly-research:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Autonomous Agent World
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python -m models.agent_world \
          --cycles ${{ github.event.inputs.cycles || '5' }} \
          --sleep 5 \
          --temperature ${{ github.event.inputs.temperature || '0.75' }} \
          --models ${{ github.event.inputs.models || 'sonnet,qwen_math' }}

    - name: Recompile Laboratory Dashboard
      run: python -m visualizer.compile_dashboard

    - name: Commit and Push Discoveries
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add outputs/conjectures.json outputs/knowledge_base.json dashboard.html
        if git diff --staged --quiet; then
          echo "No new conjectures to commit."
        else
          git commit -m "chore(nightly): record autonomous AI conjectures and recompile dashboard [skip ci]"
          git push
        fi
