name: Prime Frontier CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Core Sieve & Gap Engine
      run: python -m core.sieve

    - name: Test Modular Memory Engine
      run: python -m core.modular_orbits

    - name: Test Zeta Harmonics Spectral Engine
      run: python -m core.zeta_harmonics

    - name: Test Goldbach Engine
      run: python -m core.goldbach

    - name: Test Domain Registry
      run: python -m core.domains

    - name: Test Knowledge Base
      run: python -m models.knowledge_base

    - name: Compile Dashboard
      run: python -m visualizer.compile_dashboard
